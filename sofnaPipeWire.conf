# Create Output Sinks
context.objects = [
    {
        factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = "v-out-1"
            node.description = "Virtual Output 1"
            media.calss = Audio/Sink 
            audio.position = [ FL FR ]
            monitor.channel-volumes = true
            monitor-passthrough = true
        }
    }
    {
        factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = "v-out-2"
            node.description = "Virtual Output 2"
            media.calss = Audio/Sink 
            audio.position = [ FL FR ]
            monitor.channel-volumes = true
            monitor-passthrough = true
        }
    }
    {
        factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = "v-out-3"
            node.description = "Virtual Output 3"
            media.calss = Audio/Sink 
            audio.position = [ FL FR ]
            monitor.channel-volumes = true
            monitor-passthrough = true
        }
    }
]

# Create Input Sources
context.modules = [
    {
        name = libpipewire-module-loopback
        args = {
            node.description = "Virtual Input 1"
            audio.position = [ FL FR ]
            capture.props = {
                node.name = "v-in-1"
                node.passive = true
            }
            playback.props = {
                node.name = "v-in-1"
                media.class = "Audio/Source"
            }

        }
    }
    {
        name = libpipewire-module-loopback
        args = {
            node.description = "Virtual Input 2"
            audio.position = [ FL FR ]
            capture.props = {
                node.name = "v-in-2"
                node.passive = true
            }
            playback.props = {
                node.name = "v-in-2"
                media.class = "Audio/Source"
            }

        }
    }
    {
        name = libpipewire-module-loopback
        args = {
            node.description = "Virtual Input 3"
            audio.position = [ FL FR ]
            capture.props = {
                node.name = "v-in-3"
                node.passive = true
            }
            playback.props = {
                node.name = "v-in-3"
                media.class = "Audio/Source"
            }

        }
    }
]